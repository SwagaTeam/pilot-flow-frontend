components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Period:
      type: object
      additionalProperties: false
      properties: &id037
        start:
          type: string
          format: date
        end:
          type: string
          format: date
      required: &id038
      - start
      - end
      description: Обе даты включительно; start <= end. Проверяется сервером.
      example:
        start: '2025-11-01'
        end: '2026-10-31'
    Evidence:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          maxLength: 2000
          nullable: true
        basis:
          type: string
          maxLength: 2000
          nullable: true
        period:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
          required:
          - start
          - end
          description: Обе даты включительно; start <= end. Проверяется сервером.
          example:
            start: '2025-11-01'
            end: '2026-10-31'
          nullable: true
        assessedOn:
          type: string
          format: date
          nullable: true
        missingReason:
          type: string
          maxLength: 2000
          nullable: true
      required:
      - source
      - basis
      - period
      - assessedOn
      - missingReason
      description: Для известного ручного значения обязательны source и period либо
        assessedOn. Для пропуска missingReason обязателен при валидации готовности,
        но черновик разрешён.
      example:
        source: null
        basis: null
        period: null
        assessedOn: null
        missingReason: null
    Person:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          maxLength: 300
          nullable: true
        position:
          type: string
          maxLength: 300
          nullable: true
      required:
      - fullName
      - position
    Issue:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 100
        severity:
          type: string
          enum:
          - error
          - warning
          - info
        path:
          type: string
          maxLength: 500
        message:
          type: string
          maxLength: 2000
        suggestion:
          type: string
          maxLength: 2000
        entityId:
          type: string
          format: uuid
          nullable: true
      required:
      - code
      - severity
      - path
      - message
      - suggestion
      - entityId
      description: path — JSON Pointer к входному полю. Код стабилен; текст для человека.
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 2000
        status:
          type: integer
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          maxLength: 2000
        code:
          type: string
          maxLength: 100
        traceId:
          type: string
          maxLength: 100
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
          maxItems: 1000
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - traceId
      - issues
      example:
        type: urn:pilot:problem:validation
        title: Выбор недоступен
        status: 422
        detail: Укажите обоснование второго места
        instance: /api/v1/analyses/...
        code: SELECTION_INVALID
        traceId: demo-trace
        issues:
        - code: SECOND_PLACE_JUSTIFICATION_REQUIRED
          severity: error
          path: /justification
          message: Нужно обоснование обстоятельства вне модели
          suggestion: Укажите дополнительное обстоятельство
          entityId: null
    AnalysisInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 300
          minLength: 1
          example: Выбор потока — Север
        enterpriseName:
          type: string
          maxLength: 300
          nullable: true
        region:
          type: string
          maxLength: 200
          nullable: true
        activity:
          type: string
          maxLength: 500
          nullable: true
        projectStartDate:
          type: string
          format: date
          nullable: true
        financialPeriod:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
          required:
          - start
          - end
          description: Обе даты включительно; start <= end. Проверяется сервером.
          example:
            start: '2025-11-01'
            end: '2026-10-31'
          nullable: true
        activitiesPeriod:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
          required:
          - start
          - end
          description: Обе даты включительно; start <= end. Проверяется сервером.
          example:
            start: '2025-11-01'
            end: '2026-10-31'
          nullable: true
        forecastPeriod:
          type: object
          additionalProperties: false
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
          required:
          - start
          - end
          description: Обе даты включительно; start <= end. Проверяется сервером.
          example:
            start: '2025-11-01'
            end: '2026-10-31'
          nullable: true
        totalRevenue:
          type: string
          pattern: ^(0|[1-9][0-9]{0,17})(\.[0-9]{1,6})?$
          example: '4.200000'
          description: 'Точный decimal, до 18 целых и 6 дробных знаков; C# decimal.
            Проценты: 10 = 10%, деньги в рублях.'
          nullable: true
        currency:
          type: string
          enum:
          - RUB
        accountingBasis:
          type: string
          maxLength: 2000
          nullable: true
        revenueEvidence:
          $ref: '#/components/schemas/Evidence'
        remainderExplanation:
          type: string
          maxLength: 2000
          nullable: true
        nomenclatureComplete:
          type: boolean
        completenessEvidence:
          $ref: '#/components/schemas/Evidence'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
          maxItems: 100
        enterpriseInn:
          type: string
          pattern: ^([0-9]{10}|[0-9]{12})$
          nullable: true
        familyConclusions:
          type: string
          maxLength: 10000
          nullable: true
        rankingConclusions:
          type: string
          maxLength: 10000
          nullable: true
        laborPeriod:
          type: object
          additionalProperties: false
          properties: *id037
          required: *id038
          description: Обе даты включительно; start <= end. Проверяется сервером.
          example:
            start: '2025-11-01'
            end: '2026-10-31'
          nullable: true
      required:
      - title
      - enterpriseName
      - region
      - activity
      - projectStartDate
      - financialPeriod
      - activitiesPeriod
      - forecastPeriod
      - totalRevenue
      - currency
      - accountingBasis
      - revenueEvidence
      - remainderExplanation
      - nomenclatureComplete
      - completenessEvidence
      - participants
      - enterpriseInn
      - familyConclusions
      - rankingConclusions
      - laborPeriod
      description: PUT полностью заменяет вводимые поля. Разрешены неполные черновики;
        title непустой. Полный финансовый период — последние 12 календарных месяцев
        до projectStartDate (проектное решение).
      example: &id041
        title: Выбор потока — Север
        enterpriseName: Север (вымышленное предприятие)
        region: Учебный регион
        activity: Производство металлических изделий
        projectStartDate: '2026-11-01'
        financialPeriod: &id040
          start: '2025-11-01'
          end: '2026-10-31'
        activitiesPeriod: &id039
          start: '2026-11-01'
          end: '2027-10-31'
        forecastPeriod: *id039
        totalRevenue: '400000000'
        currency: RUB
        accountingBasis: RUB, без НДС; выручка и сырьевая себестоимость
        revenueEvidence:
          source: ТЗ, контрольный пример
          basis: Учебный контрольный пример ТЗ
          period: *id040
          assessedOn: null
          missingReason: null
        remainderExplanation: null
        nomenclatureComplete: true
        completenessEvidence:
          source: Подтверждение полного перечня
          basis: Учебный контрольный пример ТЗ
          period: null
          assessedOn: '2026-11-01'
          missingReason: null
        participants: []
        enterpriseInn: null
        familyConclusions: null
        rankingConclusions: null
        laborPeriod: &id047
          start: '2026-05-01'
          end: '2026-10-31'
    CreateAnalysis:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AnalysisInput'
      required:
      - data
      example:

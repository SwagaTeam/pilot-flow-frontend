openapi: 3.0.3
info:
  title: Выбор пилотного потока — API
  version: 1.0.0
  description: 'Контракт для ASP.NET Core / C#. SQL: PostgreSQL. Основан на локальном
    ТЗ, методике МР-11-2026 и Excel v2.0. Макет Figma сверён через браузер; карта
    экранов 01–41: figma-api-map.csv. См. handoff.html для решений и границ. Все деньги/проценты/часы
    — decimal-строки, даты ISO, UUID, JSON camelCase. Неизвестное = null, никогда
    не 0. API не доверяет баллам клиента. Все операции вложенной версии проверяют
    analysisId/versionId/владельца. Аутентификация Bearer внешнего провайдера; локальный
    dev-пользователь только в Development, без публичного доступа. Никаких кабинетов
    подписантов.'
servers:
- url: http://localhost:5080/api/v1
  description: Локальный ASP.NET backend или mock
security:
- bearerAuth: []
